<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Cris que faz</title>
  <link href="/cms.yml" type="text/yaml" rel="cms-config-url">
  <style>
    html{ -webkit-text-size-adjust:100%; }
    /* evita o zoom automatico ao tocar nos campos no celular */
    input, textarea, select{ font-size:16px !important; }

      /* mais area para tocar nos botoes/textos */
      body{ font-size:16px; }
      label{ font-size:15px !important; }
    }
  </style>
</head>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
