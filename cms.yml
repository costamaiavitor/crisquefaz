# ============================================================
#  Painel Cris que faz  (Decap CMS)
# ============================================================
backend:
  name: github
  repo: costamaiavitor/crisquefaz
  branch: main

site_url: https://cris-que-faz.netlify.app
display_url: https://cris-que-faz.netlify.app
logo_url: "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23A25231%22%20stroke-width%3D%227%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M0%2C0%20C15%2C-16%2015%2C-41%200%2C-56%20C-15%2C-41%20-15%2C-16%200%2C0%20Z%22%20transform%3D%22translate%2860%2060%29%20rotate%2845%29%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20C15%2C-16%2015%2C-41%200%2C-56%20C-15%2C-41%20-15%2C-16%200%2C0%20Z%22%20transform%3D%22translate%2860%2060%29%20rotate%28135%29%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20C15%2C-16%2015%2C-41%200%2C-56%20C-15%2C-41%20-15%2C-16%200%2C0%20Z%22%20transform%3D%22translate%2860%2060%29%20rotate%28225%29%22%2F%3E%3Cpath%20d%3D%22M0%2C0%20C15%2C-16%2015%2C-41%200%2C-56%20C-15%2C-41%20-15%2C-16%200%2C0%20Z%22%20transform%3D%22translate%2860%2060%29%20rotate%28315%29%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23A25231%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2224%22%20r%3D%226%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2296%22%20r%3D%226%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2260%22%20r%3D%226%22%2F%3E%3Ccircle%20cx%3D%2296%22%20cy%3D%2260%22%20r%3D%226%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"

media_folder: "fotos"
public_folder: "/fotos"

locale: "pt"

collections:
  - name: "site"
    label: "Meu site"
    editor:
      preview: false
    files:
      - name: "dados"
        label: "Catálogo e Contato"
        file: "site.json"
        fields:
          - { label: "WhatsApp (com 55 e DDD, só números)", name: "whatsapp", widget: "string", hint: "Exemplo: 5585988836699 — é 55 + DDD + o número, tudo junto, sem espaços." }
          - { label: "Instagram (link)", name: "instagram", widget: "string", required: false, hint: "O endereço do seu Instagram. Ex.: https://instagram.com/cris_que_faz" }
          - { label: "Instagram (arroba)", name: "instagramHandle", widget: "string", required: false, hint: "Seu @, como aparece no perfil. Ex.: @cris_que_faz" }
          - { label: "E-mail", name: "email", widget: "string", required: false, hint: "E-mail de contato que aparece no rodapé do site." }
          - { label: "Frase de atendimento", name: "cidade", widget: "string", required: false, hint: "Ex.: Atendemos toda a região · entrega local e envio para todo o Brasil" }
          - { label: "Horário", name: "horario", widget: "string", required: false, hint: "Ex.: Seg a Sáb · 9h às 18h" }
          - { label: "Foto da capa (topo do site)", name: "capa", widget: "image", required: false, hint: "A foto grande do topo da página inicial. Use uma foto bonita de um arranjo, de preferência em fundo claro ou sem fundo." }
          - label: "Arranjos (os produtos do site)"
            name: "produtos"
            label_singular: "Arranjo"
            widget: "list"
            summary: "{{fields.nome}} — R$ {{fields.preco}}"
            hint: "Toque em um arranjo para editar, ou em 'Adicionar Arranjo' lá embaixo para criar um novo."
            fields:
              - { label: "📷 Foto do arranjo", name: "imagem", widget: "image", required: false, hint: "Toque aqui para escolher uma foto da galeria do celular ou tirar na hora." }
              - { label: "Nome do arranjo", name: "nome", widget: "string", hint: "O nome que aparece no site. Ex.: Buquê Primavera." }
              - { label: "Preço (R$)", name: "preco", widget: "number", value_type: "float", step: 0.01, min: 0, hint: "Só o número, em reais. Ex.: 149.90" }
              - { label: "Categoria", name: "categoria", widget: "string", default: "Arranjos", hint: "Digite a categoria. Pode usar uma que já existe (Arranjos, Buquês, Vasos, Presentes) ou criar uma NOVA — ela vira um filtro novo na Loja automaticamente. Escreva igualzinho nos produtos da mesma categoria." }
              - { label: "Descrição", name: "descricao", widget: "text", required: false, hint: "Uma frase curtinha sobre o arranjo." }
              - { label: "Mostrar na página inicial?", name: "destaque", widget: "boolean", default: false, hint: "Ligue para esse arranjo aparecer já na primeira página do site." }
              - label: "A foto preenche o card?"
                name: "fit"
                widget: "select"
                default: "cover"
                hint: "Deixe em 'Sim' para fotos normais (a foto ocupa o card todo). Use 'Não' só se for um recorte de flor sem fundo."
                options:
                  - { label: "Sim — a foto preenche o card", value: "cover" }
                  - { label: "Não — é um recorte (flor sem fundo)", value: "contain" }
              - label: "Cor do fundo do card"
                name: "cor"
                widget: "select"
                default: "almond"
                hint: "Cor que aparece atrás da foto (aparece mais quando a foto não preenche o card)."
                options:
                  - { label: "Bege", value: "almond" }
                  - { label: "Verde", value: "green" }
                  - { label: "Terracota", value: "rust" }
                  - { label: "Creme", value: "cream" }
                  - { label: "Grafite", value: "jet" }
              - { label: "Selo (opcional)", name: "tag", widget: "string", required: false, hint: "Um selinho pequeno no canto da foto, ex.: 'Mais vendido'. Deixe vazio se não quiser." }
